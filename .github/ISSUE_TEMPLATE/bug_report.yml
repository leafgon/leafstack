name: Bug report
description: Report a reproducible problem with the toolkit or documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for helping improve the project. Do not include API tokens,
        cookies, authorization headers, runtime file references, or private
        graph data.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence of commands or steps.
      placeholder: Redact credentials and private identifiers.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Tag, release, or commit SHA where you observed the problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, shell, and Node.js version.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized logs, screenshots, or related links if useful.
